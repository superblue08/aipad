<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P2P 測試</title>
<style>
  :root { --bg:#0d0f12; --card:#171a1f; --line:#2a2f37; --fg:#e8eaed; --dim:#8b929c;
          --ok:#4fc38a; --warn:#f0b429; --bad:#ef5350; --accent:#d97757; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
         font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif; }
  .wrap { max-width:900px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 4px; } h1 b { color:var(--accent); }
  .role { color:var(--dim); font-size:14px; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 20px; margin-bottom:16px; }
  .big { font-size:30px; font-weight:600; margin:4px 0 8px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); }
  table { width:100%; border-collapse:collapse; font-size:15px; }
  td { padding:6px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
  td:first-child { color:var(--dim); width:38%; }
  pre { white-space:pre-wrap; word-break:break-all; font-size:12px; color:var(--dim); margin:0; max-height:260px; overflow:auto; }
  button { font-size:17px; padding:10px 22px; border-radius:10px; border:0; background:var(--accent); color:#fff; }
  .lbl { font-size:13px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; }
</style>
</head>
<body>
<div class="wrap">
  <h1><b>P2P</b> 直連測試</h1>
  <div class="role" id="role"></div>

  <div class="card">
    <div class="lbl">結果</div>
    <div class="big" id="result">準備中…</div>
    <table id="tbl"></table>
    <div style="margin-top:12px" id="btnrow"></div>
  </div>

  <div class="card" id="peercard" style="display:none">
    <div class="lbl">對方回報</div>
    <table id="peertbl"></table>
  </div>

  <div class="card">
    <div class="lbl">記錄</div>
    <pre id="log"></pre>
  </div>
</div>

<script>
(async function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  function log(s) { var d = new Date(); $("log").textContent = d.toTimeString().slice(0, 8) + "  " + s + "\n" + $("log").textContent; }
  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }
  function rows(id, obj) { var h = ""; for (var k in obj) h += "<tr><td>" + esc(k) + "</td><td>" + esc(obj[k]) + "</td></tr>"; $(id).innerHTML = h; }
  function setResult(text, cls) { $("result").textContent = text; $("result").className = "big " + (cls || ""); }

  // 網址：p2ptest.html#t=<topic>&k=<key>&w=<wss>&role=pc|pad（和面板同一組金鑰）
  var P = {}; location.hash.replace(/^#/, "").split("&").forEach(function (kv) {
    var p = kv.split("="); if (p[0]) P[p[0]] = decodeURIComponent(p.slice(1).join("="));
  });
  var ROLE = P.role === "pc" ? "pc" : "pad";
  $("role").textContent = ROLE === "pc" ? "角色：電腦端（發起方）— 開著這頁，再用 iPad 開測試頁" : "角色：iPad 端（回應方）";
  if (!P.t || !P.k) { setResult("網址缺少 #t= 與 k=", "bad"); return; }
  if (!(window.crypto && crypto.subtle)) { setResult("需要 HTTPS 才能加密", "bad"); return; }
  if (!window.RTCPeerConnection) { setResult("此瀏覽器不支援 WebRTC", "bad"); return; }

  // ---- AES-GCM（和 panel.html 相同格式）----
  function b64bytes(s) { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "=";
    var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function bytesb64(u) { var s = ""; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  var key = await crypto.subtle.importKey("raw", b64bytes(P.k), { name: "AES-GCM" }, false, ["encrypt", "decrypt"]);
  async function enc(obj) {
    var iv = crypto.getRandomValues(new Uint8Array(12));
    var ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, new TextEncoder().encode(JSON.stringify(obj))));
    var all = new Uint8Array(12 + ct.length); all.set(iv); all.set(ct, 12); return bytesb64(all);
  }
  async function dec(str) {
    var raw = b64bytes(str);
    var pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: raw.slice(0, 12) }, key, raw.slice(12));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  // ---- 載入 MQTT.js（SRI 檢查）----
  var SRI = "sha384-ZFaJg22VvVm4+3ZqY9eRIHGmqdEQb+c7XO+0IKspqdtPGFu6xRiPnK8xeNA//kQJ";
  await new Promise(function (ok, fail) {
    function load(urls) {
      var s = document.createElement("script"); s.src = urls[0]; s.integrity = SRI; s.crossOrigin = "anonymous";
      s.onload = ok; s.onerror = function () { urls.length > 1 ? load(urls.slice(1)) : fail(); };
      document.head.appendChild(s);
    }
    load(["mqtt.min.js", "https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"]);
  }).catch(function () { setResult("載入 MQTT 失敗", "bad"); throw 0; });

  var T_PC = P.t + "/p2p/pc", T_PAD = P.t + "/p2p/pad";
  var mq = mqtt.connect(P.w || "wss://broker.hivemq.com:8884/mqtt",
    { clientId: "aipad-p2p-" + ROLE + "-" + Math.random().toString(16).slice(2, 8), reconnectPeriod: 4000 });
  async function send(obj) { mq.publish(ROLE === "pc" ? T_PAD : T_PC, await enc(obj)); }

  // ---- WebRTC ----
  var ICE = [{ urls: ["stun:stun.l.google.com:19302", "stun:stun1.l.google.com:19302"] },
             { urls: "stun:stun.cloudflare.com:3478" }];
  var pc = null, dc = null, sid = null, cands = [], timer = null, t0 = 0, done = false;

  function candType(c) { var m = / typ (\w+)/.exec(c); return m ? m[1] : "?"; }
  function candSummary() {
    var n = { host: 0, srflx: 0, relay: 0, prflx: 0 };
    cands.forEach(function (c) { n[candType(c)] = (n[candType(c)] || 0) + 1; });
    return "host " + n.host + "、srflx " + n.srflx + (n.srflx ? "（STUN 可用）" : "（沒有取得 STUN 位址）");
  }
  function waitIce(ms) {
    return new Promise(function (r) {
      if (pc.iceGatheringState === "complete") return r();
      var t = setTimeout(r, ms);
      pc.addEventListener("icegatheringstatechange", function () { if (pc.iceGatheringState === "complete") { clearTimeout(t); r(); } });
    });
  }
  function newPC() {
    if (pc) try { pc.close(); } catch (e) {}
    pc = new RTCPeerConnection({ iceServers: ICE }); dc = null; cands = []; done = false;
    pc.onicecandidate = function (e) { if (e.candidate && e.candidate.candidate) { cands.push(e.candidate.candidate); log("候選位址：" + candType(e.candidate.candidate)); } };
    pc.oniceconnectionstatechange = function () {
      log("ICE 狀態：" + pc.iceConnectionState);
      if (pc.iceConnectionState === "failed") finish(false, "ICE failed（打洞失敗）");
    };
    clearTimeout(timer);
    timer = setTimeout(function () { if (!done) finish(false, "25 秒內沒有建立連線（最後 ICE 狀態：" + pc.iceConnectionState + "）"); }, 25000);
    t0 = Date.now();
  }

  async function selectedPair() {
    var st = await pc.getStats(), pair = null, byId = {};
    st.forEach(function (r) { byId[r.id] = r; });
    st.forEach(function (r) { if (r.type === "transport" && r.selectedCandidatePairId) pair = byId[r.selectedCandidatePairId]; });
    if (!pair) st.forEach(function (r) { if (r.type === "candidate-pair" && r.state === "succeeded" && (r.nominated || r.selected)) pair = pair || r; });
    if (!pair) return null;
    var l = byId[pair.localCandidateId] || {}, rm = byId[pair.remoteCandidateId] || {};
    return { local: l.candidateType, remote: rm.candidateType, proto: l.protocol || rm.protocol,
             rtt: pair.currentRoundTripTime != null ? Math.round(pair.currentRoundTripTime * 1000) : null };
  }
  function describe(sp) {
    if (!sp) return "未知";
    if (sp.local === "host" && sp.remote === "host") return "host ↔ host（同網段直接連線）";
    if (sp.local === "relay" || sp.remote === "relay") return "relay（經 TURN 中繼，不算 P2P）";
    return sp.local + " ↔ " + sp.remote + "（NAT 打洞成功）";
  }

  // 兩邊會同時測延遲，所以同一個 onmessage 要同時負責「回 pong」和「收 pong」
  var pongWaiter = null;
  function setupDC(ch) {
    dc = ch;
    dc.onmessage = function (e) {
      if (e.data === "ping") dc.send("pong");
      else if (e.data === "pong" && pongWaiter) { var w = pongWaiter; pongWaiter = null; w(); }
    };
    dc.onopen = async function () {
      log("DataChannel 已開啟，開始測延遲");
      var rtts = [];
      for (var i = 0; i < 10; i++) {
        var t = performance.now();
        await new Promise(function (r) { pongWaiter = r; dc.send("ping"); });
        rtts.push(performance.now() - t);
        await new Promise(function (r) { setTimeout(r, 200); });
      }
      var avg = Math.round(rtts.reduce(function (a, b) { return a + b; }, 0) / rtts.length);
      finish(true, "", avg);
    };
  }

  async function finish(ok, reason, avgRtt) {
    if (done) return; done = true; clearTimeout(timer);
    var sp = ok ? await selectedPair() : null;
    var info = {
      "結果": ok ? "✅ P2P 直連成功" : "❌ P2P 失敗",
      "連線方式": ok ? describe(sp) : reason,
      "協定": sp && sp.proto ? sp.proto.toUpperCase() : "-",
      "延遲（DataChannel 來回）": avgRtt != null ? avgRtt + " ms" : "-",
      "建立連線花費": ((Date.now() - t0) / 1000).toFixed(1) + " 秒",
      "本機候選位址": candSummary(),
      "瀏覽器": navigator.userAgent.replace(/^Mozilla\/5.0 /, "").slice(0, 80)
    };
    setResult(info["結果"], ok ? "ok" : "bad");
    rows("tbl", info);
    send({ type: "report", sid: sid, role: ROLE, info: info });
    if (ROLE === "pad") $("btnrow").innerHTML = '<button id="again">再測一次</button>';
    var b = $("again"); if (b) b.onclick = startPad;
    log(ok ? "完成" : "失敗：" + reason);
  }

  // ---- 流程：iPad 每 3 秒喊 hello → 電腦送 offer → iPad 回 answer → 直連 ----
  var helloTimer = null;
  function startPad() {
    sid = Math.random().toString(36).slice(2, 10); done = false;
    $("btnrow").innerHTML = ""; $("tbl").innerHTML = ""; $("peercard").style.display = "none";
    setResult("等待電腦端回應…", "warn");
    clearInterval(helloTimer);
    var sayHello = function () { send({ type: "hello", sid: sid }); };
    sayHello(); helloTimer = setInterval(sayHello, 3000);
    log("送出 hello（" + sid + "）");
  }

  mq.on("connect", function () {
    log("MQTT 已連線");
    mq.subscribe(ROLE === "pc" ? T_PC : T_PAD);
    if (ROLE === "pc") setResult("等待 iPad…", "warn"); else startPad();
  });
  mq.on("message", async function (topic, m) {
    var msg; try { msg = await dec(m.toString()); } catch (e) { log("收到無法解密的訊息（忽略）"); return; }
    if (msg.type === "report") { $("peercard").style.display = ""; rows("peertbl", msg.info); return; }
    if (ROLE === "pc") {
      if (msg.type === "hello" && msg.sid !== sid) {
        sid = msg.sid; log("收到 iPad hello（" + sid + "），建立 offer");
        setResult("交換連線資訊中…", "warn"); $("tbl").innerHTML = ""; $("peercard").style.display = "none";
        newPC(); setupDC(pc.createDataChannel("t"));
        await pc.setLocalDescription(await pc.createOffer());
        await waitIce(6000);
        send({ type: "offer", sid: sid, sdp: pc.localDescription.sdp }); log("已送出 offer");
      } else if (msg.type === "answer" && msg.sid === sid) {
        log("收到 answer，開始打洞");
        await pc.setRemoteDescription({ type: "answer", sdp: msg.sdp });
      }
    } else if (msg.type === "offer" && msg.sid === sid && !pc_for(sid)) {
      clearInterval(helloTimer);
      log("收到 offer，建立 answer"); setResult("交換連線資訊中…", "warn");
      newPC(); padSid = sid; pc.ondatachannel = function (e) { setupDC(e.channel); };
      await pc.setRemoteDescription({ type: "offer", sdp: msg.sdp });
      await pc.setLocalDescription(await pc.createAnswer());
      await waitIce(6000);
      send({ type: "answer", sid: sid, sdp: pc.localDescription.sdp }); log("已送出 answer，開始打洞");
    }
  });
  var padSid = null;
  function pc_for(s) { return padSid === s; }
})();
</script>
</body>
</html>
